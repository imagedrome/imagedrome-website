  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Imagedrome, Inc.",
    "alternateName": "Imagedrome",
    "url": "https://imagedrome.com",
    "logo": "https://imagedrome.com/assets/images/apple-touch-icon.png",
    "email": "info@imagedrome.com",
    "description": "Imagedrome is a software company that supports planning and development of mobile products with Broong, Inc. and Monstreet, Inc.",
    "knowsAbout": [
      "software development",
      "mobile apps",
      "Imagedrome",
      "Broong",
      "Monstreet"
    ],
    "sameAs": [
      "https://broong.com",
      "https://monstreet.com",
      "https://beyo.day"
    ]
  }
  </script>
</head>
<body class="home">

  <main class="poster">
    <img
      class="poster-title"
      src="/assets/images/site_title@2x.png"
      width="760"
      height="168"
      alt="Beyo — AI Countdown"
      decoding="async"
    >

    <div class="poster-shots" aria-label="Beyo app screenshots">
      <img
        src="/assets/images/image01@2x.png"
        width="270"
        height="587"
        alt="Beyo home screen with event countdowns"
        decoding="async"
      >
      <img
        src="/assets/images/image02@2x.png"
        width="270"
        height="587"
        alt="Beyo event detail with countdown and reminders"
        decoding="async"
      >
      <img
        src="/assets/images/image03@2x.png"
        width="270"
        height="587"
        alt="Beyo preparation checklist for an upcoming event"
        decoding="async"
      >
      <img
        src="/assets/images/image04@2x.png"
        width="270"
        height="587"
        alt="Beyo capturing an event from a photo or screenshot"
        decoding="async"
      >
    </div>

    <a
      class="poster-icon-link"
      href="https://apps.apple.com/app/beyo/id1397284424"
      aria-label="Download Beyo on the App Store"
    >
      <img
        class="poster-icon"
        src="/assets/images/app_icon@2x.png"
        width="90"
        height="90"
        alt="Beyo app icon"
        decoding="async"
      >
    </a>

    <a
      class="poster-badge"
      href="https://apps.apple.com/app/beyo/id1397284424"
      aria-label="Download on the App Store"
    >
      <img
        src="/assets/images/appstore.svg"
        width="120"
        height="40"
        alt="Download on the App Store"
        decoding="async"
      >
    </a>

    <img
      class="poster-copy"
      src="/assets/images/allrightsreserved@2x.png"
      width="370"
      height="21"
      alt="© 2026 Broong Inc. All rights reserved. Imagedrome, Inc. supports Broong and Monstreet products."
      decoding="async"
    >

    <a class="poster-email" href="#" aria-label="Email Imagedrome" id="poster-email">
      <img
        src="/assets/images/email@2x.png"
        width="38"
        height="26"
        alt="Email"
        decoding="async"
      >
    </a>
  </main>

  <script>
    (function () {
      var el = document.getElementById("poster-email");
      if (!el) return;
      el.addEventListener("click", function (e) {
        e.preventDefault();
        window.location.href = "mailto:" + "info" + "@" + "imagedrome.com";
      });
    })();
  </script>
</body>
</html>
